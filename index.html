<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Daniel Oliaei — BIM Specialist & Developer. A mountain, drawn live in WebGPU."
    />
    <meta name="theme-color" content="#000000" />
    <script>
      /* apply the saved theme BEFORE first paint (no flash). Mirrors src/theme.ts currentTheme():
         a stored "light" wins, anything else is the black frame (the OS preference is NOT followed —
         the dark piece is the default). Keep the storage key in sync with theme.ts (do:theme). The
         single theme-color meta below is rewritten here and again by theme.ts on every switch. */
      (function () {
        var t = null;
        try { t = localStorage.getItem("do:theme"); } catch (e) {}
        if (t !== "light") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f4f1ea" : "#000000");
      })();
    </script>
    <title>Daniel Oliaei — BIM Specialist & Developer</title>

    <!-- social-share cards. og:url, og:image and a favicon/apple-touch-icon still
         need the deploy URL + an image asset — add those once the domain is known. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Oliaei — BIM Specialist & Developer" />
    <meta
      property="og:description"
      content="A monochrome WebGPU mountain you orbit, mapping a professional path up the slope."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daniel Oliaei — BIM Specialist & Developer" />
    <meta
      name="twitter:description"
      content="A monochrome WebGPU mountain you orbit, mapping a professional path up the slope."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter drives the site UI; Hanken Grotesk (a friendly grotesque) drives the fixed
         header + the full-screen menu (see --nav in index.css). The intended look is ABC
         Dinamo "Social" — there's an @font-face swap point in index.css to drop it in. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
