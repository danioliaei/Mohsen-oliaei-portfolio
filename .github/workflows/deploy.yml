name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# publish to GitHub Pages from GitHub Actions (Pages source = "GitHub Actions")
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/globe.test.mjs
      # the site lives under /<repo>/ on a project Pages site; vite.config.ts reads DEPLOY_BASE
      - run: npm run build
        env:
          DEPLOY_BASE: /Mohsen-oliaei-portfolio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
